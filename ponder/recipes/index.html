<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A website with a recipe for apple crisps">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="A website with a recipe for apple crisps">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="images/socialpreview.jpg">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="RecipeBook">
    <meta name="twitter:description" content="A website with a recipe for apple crisps">
    <meta name="twitter:image" content="images/socialpreview.jpg">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/appleicon.jpg">

    <link rel=stylesheet href="styles.css">

    <title>Document</title>
</head>
<body>
    <header>
        <div id="logo">
            <img src="images/recipe-book.png" alt="logo">
            <h1>Recipebook</h1>
        </div>
        <form id="searchbar">
            <input type="text" id="search" name="search" placeholder="Find a recipe">
            <hr>
            <button type="submit"><img src="images/search.svg" alt="Search button"></button>
        </form>
    </header>
    <hr>
    <main>
        <div id="recipe">
            <img src="images/apple-crisp.jpg" alt="Apple crisp">
            <div>
                <button>dessert</button>
                <h2>Apple crisp</h2>
                <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>
                <p>This apple crisp recipe is a simple yet delicious fall desert that's great served warm with vanilla ice cream.</p>
            </div>
        </div>
    </main>
    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>                  
                
    </footer>
</body>
</html>
